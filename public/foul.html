<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Foul Announcement</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body{background:#000;margin:0}
      .announce{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
      .card{background:rgba(0,0,0,0.6);color:#fff;padding:28px 36px;border-radius:12px;text-align:center;min-width:600px;max-width:90%;box-shadow:0 12px 40px rgba(0,0,0,1);opacity:0;transform:scale(0.96);transition:opacity 400ms ease, transform 400ms ease}
      .card.show{opacity:1;transform:scale(1)}
      .foul-type{font-family:Oswald, Arial, sans-serif;font-size:28px;color:#f2c390; text-shadow: 2px 2px 2px #000000;   }
      .foul-main{font-family:Oswald, Arial, sans-serif;font-size:72px;margin-top:6px}
      .foul-sub{font-size:20px;color:rgba(255,255,255,0.85);margin-top:8px}
      @media (max-width:720px){.card{padding:18px;min-width:260px}.foul-main{font-size:44px}}
    </style>
  </head>
  <body>
    <div class="announce" id="announceWrap">
      <div class="card" id="announceCard">
        <div class="foul-type" id="foulType">FOUL</div>
        <div class="foul-main" id="foulMain">HOME #0</div>
        <div class="foul-sub" id="foulSub">Personal</div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const card = document.getElementById('announceCard');
      const foulType = document.getElementById('foulType');
      const foulMain = document.getElementById('foulMain');
      const foulSub = document.getElementById('foulSub');

      function showAnnouncement(p) {
        // p: {team, playerNumber, type, duration}
        const teamLabel = (p.team === 'home') ? (window.__state?.home?.name || 'HOME') : (window.__state?.away?.name || 'AWAY');
        foulMain.textContent = `${teamLabel}${p.playerNumber ? ' #' + p.playerNumber : ''}`;
        foulSub.textContent = p.type || '';
        foulType.textContent = (p.type || '').toUpperCase();
        // color by team (use state if available)
        const teamColor = (p.team === 'home') ? (window.__state?.home?.color || '#0052cc') : (window.__state?.away?.color || '#cc0000');
        card.style.border = `4px solid ${teamColor}`;
        card.classList.add('show');
        const dur = Number(p.duration) || 8;
        setTimeout(()=>{ card.classList.remove('show'); }, dur*1000);
      }

      socket.on('announceFoul', (p) => { showAnnouncement(p); });

      // keep last state for colors from main state emitter
      window.__state = null;
      socket.on('state', (s) => { window.__state = s; });
    </script>
  </body>
</html>
